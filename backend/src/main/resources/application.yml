server:
  port: 8080

spring:
  application:
    name: taskboard

  # H2データベース設定（開発用インメモリ）
  datasource:
    url: jdbc:h2:mem:taskboard
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2コンソール有効化
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA設定
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: false

# JWT設定（開発用固定値）
jwt:
  secret: dev-secret-key-for-taskboard-application-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24時間（ミリ秒）

# ログ設定
logging:
  level:
    com.example.taskboard: DEBUG
    org.springframework.security: DEBUG
